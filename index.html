<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>CodeNest - Thank You</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 20px;

      background:
        linear-gradient(rgba(10, 10, 20, 0.45),
          rgba(10, 10, 20, 0.60)),
        url('https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=2070&auto=format&fit=crop');

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .glass-card {
      width: 100%;
      max-width: 540px;

      padding: 50px 40px;

      border-radius: 30px;

      background: rgba(255, 255, 255, 0.08);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border: 1px solid rgba(255, 255, 255, 0.15);

      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.35),
        inset 0 0 1px rgba(255, 255, 255, 0.2);

      text-align: center;

      animation: fadeUp 1s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .brand {
      color: white;
      font-size: 2.1rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }

    .checkmark {
      width: 95px;
      height: 95px;

      margin: 0 auto 25px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 42px;
      font-weight: bold;
      color: white;

      background: linear-gradient(135deg, #ff4f9a, #7a4dff);

      box-shadow:
        0 0 25px rgba(255, 79, 154, 0.45),
        0 0 40px rgba(122, 77, 255, 0.25);
    }

    h1 {
      color: white;
      font-size: 2.2rem;
      font-weight: 600;
      margin-bottom: 18px;
    }

    .description {
      color: rgba(255, 255, 255, 0.82);

      line-height: 1.8;
      font-size: 0.98rem;

      margin-bottom: 38px;
    }

    .button-group {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      text-decoration: none;

      padding: 14px 28px;

      border-radius: 50px;

      font-size: 0.95rem;
      font-weight: 500;

      transition: 0.3s ease;

      min-width: 200px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .primary-btn {
      color: white;

      background: linear-gradient(135deg, #ff4f9a, #7a4dff);

      box-shadow: 0 8px 22px rgba(122, 77, 255, 0.35);
    }

    .primary-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(122, 77, 255, 0.45);
    }

    .secondary-btn {
      color: white;

      border: 1px solid rgba(255, 255, 255, 0.18);

      background: rgba(255, 255, 255, 0.05);
    }

    .secondary-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
    }

    .footer {
      margin-top: 35px;

      color: rgba(255, 255, 255, 0.55);

      font-size: 0.82rem;
    }

    @media (max-width: 600px) {

      .glass-card {
        padding: 40px 25px;
      }

      .brand {
        font-size: 1.8rem;
      }

      h1 {
        font-size: 1.7rem;
      }

      .description {
        font-size: 0.92rem;
      }

      .btn {
        width: 100%;
        min-width: unset;
      }

      .button-group {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <div class="glass-card">

    <div class="brand">CodeNest</div>

    <div class="checkmark">
      ✓
    </div>

    <h1>Thank You For Your Purchase!</h1>

    <div class="description">
      Your order has been completed successfully.
      Thank you for choosing CodeNest.
      Your purchase details and product access will be delivered shortly.
    </div>

    <div class="button-group">

      <a href="https://codenest.mysellauth.com/"
        class="btn primary-btn">

        Go To Dashboard

      </a>

      <a href="https://discord.gg/eG3KwUXcmB"
        target="_blank"
        class="btn secondary-btn">

        Join Support Server

      </a>

    </div>

    <div class="footer">
      © 2026 CodeNest • All Rights Reserved
    </div>

  </div>

</body>

</html>
